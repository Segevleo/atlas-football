name: ATLAS hourly news refresh
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-hourly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public RSS news
        run: python collector.py
      - name: Commit changed snapshot
        run: |
          if ! git diff --quiet -- data/dashboard.json; then
            git config user.name "atlas-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "chore: refresh ATLAS news snapshot"
            git push
          else
            echo "No new data"
          fi
